[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gewerbesteuer-dach"
version = "1.0.0"
description = "Gewerbesteuer- & Hebesatz-Rechner 2026 fuer Deutschland nach GewStG und Paragraph 35 EStG"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "DACH Digitalwerk", email = "dach.digitalwerk@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
dach-gewerbesteuer = "gewerbesteuer_dach.cli:main"

[project.urls]
"Homepage" = "https://dach-digitalwerk.netlify.app/gewerbesteuer-hebesatz-rechner/"
"Bug Tracker" = "https://github.com/DACHDigitalwerk/gewerbesteuer-hebesatz-rechner-dach/issues"
"Source" = "https://github.com/DACHDigitalwerk/gewerbesteuer-hebesatz-rechner-dach"
